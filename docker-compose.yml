services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geosyncai
      POSTGRES_USER: geosyncai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["geosyncai_pgdata:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U geosyncai -d geosyncai"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    networks: [backend]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://geosyncai:${POSTGRES_PASSWORD}@postgres:5432/geosyncai
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      STORAGE_DIR: /app/storage
      AUTO_BOOTSTRAP: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      SECURITY_REDIS_URL: ${SECURITY_REDIS_URL:-redis://redis:6379/1}
      TRUSTED_PROXY_CIDRS: '["172.30.91.2/32"]'
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-600}
      LOGIN_REQUESTS_PER_MINUTE: ${LOGIN_REQUESTS_PER_MINUTE:-20}
      ACCOUNT_LOGIN_REQUESTS_PER_WINDOW: ${ACCOUNT_LOGIN_REQUESTS_PER_WINDOW:-10}
      ACCOUNT_LOGIN_WINDOW_SECONDS: ${ACCOUNT_LOGIN_WINDOW_SECONDS:-900}
      HEAVY_REQUESTS_PER_MINUTE: ${HEAVY_REQUESTS_PER_MINUTE:-60}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-64}
      MAX_CONCURRENT_HEAVY_REQUESTS: ${MAX_CONCURRENT_HEAVY_REQUESTS:-2}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-2097152}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-262144000}
      MAX_SOURCE_RECORDS: ${MAX_SOURCE_RECORDS:-50000}
      MAX_ACTIVE_JOBS_PER_PROJECT: ${MAX_ACTIVE_JOBS_PER_PROJECT:-10}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["geosyncai_storage:/app/storage"]
    networks:
      backend:
      edge:
        ipv4_address: 172.30.91.3
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --no-access-log --limit-concurrency 128 --timeout-keep-alive 10"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://geosyncai:${POSTGRES_PASSWORD}@postgres:5432/geosyncai
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      STORAGE_DIR: /app/storage
      AUTO_BOOTSTRAP: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      SECURITY_REDIS_URL: ${SECURITY_REDIS_URL:-redis://redis:6379/1}
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
    volumes: ["geosyncai_storage:/app/storage"]
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_CARTO_BASEMAP_KEY: ${VITE_CARTO_BASEMAP_KEY:-}
    ports: ["127.0.0.1:5173:80"]
    networks:
      edge:
        ipv4_address: 172.30.91.2
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
volumes:
  geosyncai_pgdata:
  geosyncai_storage:
networks:
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.30.91.0/24

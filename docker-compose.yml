services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geosyncai
      POSTGRES_USER: geosyncai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["geosyncai_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U geosyncai -d geosyncai"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://geosyncai:${POSTGRES_PASSWORD}@postgres:5432/geosyncai
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      STORAGE_DIR: /app/storage
      AUTO_BOOTSTRAP: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: ["geosyncai_storage:/app/storage"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://geosyncai:${POSTGRES_PASSWORD}@postgres:5432/geosyncai
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      STORAGE_DIR: /app/storage
      AUTO_BOOTSTRAP: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes: ["geosyncai_storage:/app/storage"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  geosyncai_pgdata:
  geosyncai_storage:

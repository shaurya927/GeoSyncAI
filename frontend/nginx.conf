limit_req_zone $binary_remote_addr zone=api_traffic:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_traffic:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=client_connections:10m;
log_format geosyncai escape=json '{"request_id":"$request_id","api_request_id":"$upstream_http_x_request_id","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /var/log/nginx/access.log geosyncai;
  include /etc/nginx/security-headers.conf;
  client_max_body_size 251m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;
  limit_conn client_connections 20;
  limit_conn_status 503;
  limit_req_status 429;
  error_page 429 = @traffic_limited;
  error_page 503 = @server_busy;

  location @traffic_limited {
    include /etc/nginx/security-headers.conf;
    add_header Retry-After 10 always;
    default_type application/json;
    return 429 '{"detail":"Too many requests; retry in 10 seconds"}';
  }
  location @server_busy {
    include /etc/nginx/security-headers.conf;
    add_header Retry-After 2 always;
    default_type application/json;
    return 503 '{"detail":"Server is busy; retry shortly"}';
  }

  location = /api/auth/token {
    limit_req zone=login_traffic burst=5 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-GeoSyncAI-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://api:8000;
    proxy_read_timeout 30s;
  }

  location = /api/health {
    limit_req zone=api_traffic burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-GeoSyncAI-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://api:8000/health;
    proxy_read_timeout 300s;
  }

  location = /api/ready {
    limit_req zone=api_traffic burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-GeoSyncAI-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://api:8000/ready;
    proxy_read_timeout 300s;
  }

  location /api/ {
    limit_req zone=api_traffic burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-GeoSyncAI-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://api:8000;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
  location ~ /\. {
    deny all;
  }
}

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://basemaps.cartocdn.com; connect-src 'self' https://tile.openstreetmap.org https://basemaps.cartocdn.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

name: Acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: isolated-ci-password
      JWT_SECRET: isolated-ci-compose-jwt-secret-at-least-32
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geosyncai_test
          POSTGRES_USER: geosyncai
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U geosyncai -d geosyncai_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Audit Python and frontend dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements-dev.txt --no-deps --disable-pip
          npm --prefix frontend audit --audit-level=high
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://geosyncai:isolated-ci-password@localhost:5432/geosyncai_test
          BROKER_TEST_URL: redis://localhost:6379/15
      - name: Run isolated officer browser workflow
        run: python -m pytest e2e/test_browser.py -q
        env:
          E2E_DATABASE_URL: postgresql+psycopg://geosyncai:isolated-ci-password@localhost:5432/geosyncai_test
      - run: npm run typecheck && npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
      - name: Test production offline and reviewed geometry workflows
        run: python -m pytest e2e/test_submission_repairs.py -q
      - name: Start production Compose stack
        run: docker compose -p geosyncai-ci up -d --build --wait --wait-timeout 180
      - name: Seed isolated production demo
        run: |
          docker compose -p geosyncai-ci exec -T api python -c "import os; assert os.getuid() == 10001"
          docker compose -p geosyncai-ci exec -T worker python -c "import os; assert os.getuid() == 10001"
          docker compose -p geosyncai-ci exec -T api python -m app.seed_demo
      - name: Run production Nginx browser smoke
        run: python -m pytest e2e/test_production_compose.py -q
        env:
          BASE_URL: http://127.0.0.1:5173
      - name: Show production logs on failure
        if: failure()
        run: docker compose -p geosyncai-ci logs --no-color
      - name: Clean up production Compose stack
        if: always()
        run: docker compose -p geosyncai-ci down --volumes --remove-orphans
